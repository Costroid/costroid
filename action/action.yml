name: Costroid
description: Run a coding agent under a budget, record what it cost and report it on the pull request.

inputs:
  stage:
    description: >-
      run installs and runs the agent, then keeps its rows as an artifact. read reads the
      execution file of a claude-code-action run that already ended, then keeps its rows the same
      way. ingest sends those rows to a ledger, to Costroid Platform, or to both. report posts the
      check and the comment. all does run and report in one job, which gives the agent's job the
      report's permissions, so the recipes never use it. install installs costroid and does
      nothing else, so a later step can run it, as the fork follow-up recipe does. It has no
      default, and an empty stage fails the step with the list of stages.
    required: true
  version:
    description: >-
      The costroid release to install, without the leading v. Leave it and sha256 empty to
      install the release whose tag points at this action's commit, checked by its signature.
    default: ""
  sha256:
    description: The SHA-256 of that release's binary for this runner. Set it with version, or neither.
    default: ""
  agent:
    description: claude or codex.
    default: claude
  prompt:
    description: The prompt. Never build it from pull request text or from a comment.
    default: ""
  agent-args:
    description: Extra arguments for the agent, one per line.
    default: ""
  minimum-agent-version:
    description: The lowest agent version this run accepts.
    default: ""
  agent-version:
    description: >-
      For stage run, the agent version to install when the agent is not on the runner. Empty
      installs the version this release's recipes install. An agent already on the runner is
      used as it is, held to minimum-agent-version.
    default: ""
  budget-usd:
    description: The run's budget in USD.
    default: ""
  execution-file:
    description: For stage read, the execution_file output of the claude-code-action step.
    default: ""
  codex-home:
    description: >-
      For stage read, in place of execution-file: the codex-home of an openai/codex-action step
      that already ended in this job. Give that step a directory made for the job, under
      runner.temp.
    default: ""
  show-output:
    description: >-
      true prints the agent's own stream, its reasoning and its replies, to the job
      log. A public repository's log is public, so leave it false there.
    default: "false"
  api-key:
    description: The provider key. It reaches the agent's step and no other.
    default: ""
  billing-account:
    description: The value of BillingAccountId on every row.
    default: ""
  credential:
    description: The value of SubAccountId on every row. The id of the key, workspace or project, never the key.
    default: ""
  github-token:
    description: The token that posts the check and the comment.
    default: ${{ github.token }}
  agent-result:
    description: >-
      For stage report, the result of the agent's job, as needs.<job>.result gives it. skipped
      makes the report say the agent did not run on the pull request, in place of a report
      with no rows. Empty tells the report nothing.
    default: ""
  ingest-url:
    description: The ledger's rows endpoint.
    default: ""
  ingest-audience:
    description: The audience the ledger requires on the CI token.
    default: ""
  platform-url:
    description: >-
      For stage ingest, Costroid Platform's https origin, such as https://app.costroid.com. Empty
      sends nothing there. docs/export.md says how to connect a repository.
    default: ""
  installation-id:
    description: >-
      For stage ingest with platform-url, the installation the rows come through, as the platform
      bound it: github-owner:<repository_owner_id>, or github:<id> where the GitHub App is
      installed.
    default: ""
  platform-token:
    description: >-
      For stage ingest with platform-url, an integration token from a secret, with the rows:write
      and identity:read scopes. It reaches the ingest step and no other.
    default: ""

outputs:
  cost:
    description: >-
      The run's cost as a decimal string, set by stage report or all. Empty when the figures
      span more than one currency or basis, because those are never summed; result holds each.
    value: ${{ steps.report.outputs.cost }}
  currency:
    description: The ISO currency code of cost, or multiple when the figures hold more than one.
    value: ${{ steps.report.outputs.currency }}
  cost_basis:
    description: >-
      What cost is: measured, list_equivalent, estimate, billed or derived. multiple when the
      figures hold more than one basis.
    value: ${{ steps.report.outputs.cost_basis }}
  tokens_input_uncached:
    description: Input tokens read without the cache. Empty when cost is.
    value: ${{ steps.report.outputs.tokens_input_uncached }}
  tokens_cache_read:
    description: Input tokens read from the cache. Empty when cost is.
    value: ${{ steps.report.outputs.tokens_cache_read }}
  tokens_cache_write:
    description: Input tokens written to the cache, every lifetime together. Empty when cost is.
    value: ${{ steps.report.outputs.tokens_cache_write }}
  tokens_output:
    description: Output tokens. Empty when cost is.
    value: ${{ steps.report.outputs.tokens_output }}
  enforcement_grade:
    description: The weakest enforcement grade of the run's figures.
    value: ${{ steps.report.outputs.enforcement_grade }}
  catalog_version:
    description: The price catalog that priced the rows, or multiple when they name more than one.
    value: ${{ steps.report.outputs.catalog_version }}
  check_run_id:
    description: The id of the check run the report posted. Empty when none was posted.
    value: ${{ steps.report.outputs.check_run_id }}
  conclusion:
    description: >-
      The check's conclusion from the policy: success, neutral or failure. docs/policy.md says
      how each is reached.
    value: ${{ steps.report.outputs.conclusion }}
  result:
    description: >-
      The result object as one line of JSON, the check run's machine block, every amount
      included. docs/agents.md describes it.
    value: ${{ steps.report.outputs.result }}

runs:
  using: composite
  steps:
    # In stages report and ingest the rows come first, into a directory of their
    # own, and costroid is installed after them from the release. Nothing the
    # agent's job put in the artifact can then stand in for the binary, a tool
    # or the event file. An artifact that holds more than the rows and the run
    # object fails ingest, and in stage report it is deleted unread and the
    # report fails its check.
    - name: Fetch the rows
      if: inputs.stage == 'report' || inputs.stage == 'ingest'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: costroid-rows
        path: ${{ runner.temp }}/costroid-rows-in

    - name: Install cosign
      if: inputs.version == '' && inputs.sha256 == ''
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install costroid
      id: install
      shell: bash
      env:
        COSTROID_STAGE: ${{ inputs.stage }}
        COSTROID_VERSION: ${{ inputs.version }}
        COSTROID_SHA256: ${{ inputs.sha256 }}
        COSTROID_ACTION_REF: ${{ github.action_ref }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Run the agent
      if: inputs.stage == 'run' || inputs.stage == 'all'
      shell: bash
      env:
        COSTROID_AGENT: ${{ inputs.agent }}
        COSTROID_PROMPT: ${{ inputs.prompt }}
        COSTROID_AGENT_ARGS: ${{ inputs.agent-args }}
        COSTROID_MINIMUM_AGENT_VERSION: ${{ inputs.minimum-agent-version }}
        COSTROID_AGENT_VERSION: ${{ inputs.agent-version }}
        COSTROID_BUDGET_USD: ${{ inputs.budget-usd }}
        COSTROID_AGENT_KEY: ${{ inputs.api-key }}
        COSTROID_BILLING_ACCOUNT: ${{ inputs.billing-account }}
        COSTROID_CREDENTIAL: ${{ inputs.credential }}
        COSTROID_ROWS: ${{ runner.temp }}/costroid-rows.jsonl
        COSTROID_SHOW_OUTPUT: ${{ inputs.show-output }}
      run: bash "$GITHUB_ACTION_PATH/run-agent.sh"

    - name: Read the agent's run
      if: always() && inputs.stage == 'read'
      shell: bash
      env:
        COSTROID_EXECUTION_FILE: ${{ inputs.execution-file }}
        COSTROID_CODEX_HOME: ${{ inputs.codex-home }}
        COSTROID_MINIMUM_AGENT_VERSION: ${{ inputs.minimum-agent-version }}
        COSTROID_BILLING_ACCOUNT: ${{ inputs.billing-account }}
        COSTROID_CREDENTIAL: ${{ inputs.credential }}
        COSTROID_ROWS: ${{ runner.temp }}/costroid-rows.jsonl
      run: bash "$GITHUB_ACTION_PATH/read-run.sh"

    - name: Keep the rows
      if: always() && (inputs.stage == 'run' || inputs.stage == 'read')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: costroid-rows
        # The run's result object rides with the rows, so the report can say
        # why a run wrote none.
        path: |
          ${{ runner.temp }}/costroid-rows.jsonl
          ${{ runner.temp }}/costroid-rows.run.json
        if-no-files-found: warn
        retention-days: 7

    # The report runs after a failed agent, so it can say why the run wrote no
    # rows, and never after a refused install. An artifact the install refused
    # reaches it as the install's outputs, never as files.
    - name: Report on the pull request
      id: report
      if: always() && steps.install.outcome == 'success' && (inputs.stage == 'report' || inputs.stage == 'all')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COSTROID_ROWS: ${{ inputs.stage == 'all' && format('{0}/costroid-rows.jsonl', runner.temp) || format('{0}/costroid-rows-in/costroid-rows.jsonl', runner.temp) }}
        COSTROID_BUDGET_USD: ${{ inputs.budget-usd }}
        COSTROID_AGENT_RESULT: ${{ inputs.agent-result }}
        COSTROID_ARTIFACT_REFUSED: ${{ steps.install.outputs.refused }}
        COSTROID_ARTIFACT_REFUSED_COUNT: ${{ steps.install.outputs.refused_count }}
        COSTROID_PLATFORM_URL: ${{ inputs.platform-url }}
      run: |
        touch "$COSTROID_ROWS"
        costroid report --rows "$COSTROID_ROWS" ${COSTROID_BUDGET_USD:+--budget-usd "$COSTROID_BUDGET_USD"}

    - name: Send the rows to the ledger
      if: inputs.stage == 'ingest'
      shell: bash
      env:
        COSTROID_INGEST_URL: ${{ inputs.ingest-url }}
        COSTROID_INGEST_AUDIENCE: ${{ inputs.ingest-audience }}
        COSTROID_PLATFORM_URL: ${{ inputs.platform-url }}
        COSTROID_PLATFORM_INSTALLATION_ID: ${{ inputs.installation-id }}
        COSTROID_PLATFORM_TOKEN: ${{ inputs.platform-token }}
        COSTROID_ROWS: ${{ runner.temp }}/costroid-rows-in/costroid-rows.jsonl
      run: bash "$GITHUB_ACTION_PATH/ingest.sh"
