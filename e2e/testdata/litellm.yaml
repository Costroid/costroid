# The gateway journey's LiteLLM. Both models route to the mock upstream the test
# serves, at the pinned catalog's list prices: claude-haiku-5-5 at USD 0.10 per
# million input tokens and 0.50 per million output tokens on the Messages API,
# gpt-5-nano at USD 0.05 and 0.40 on the Responses API. A store failure lets
# requests through, which is the case the journey records as none.
model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: os.environ/MOCK_UPSTREAM
      api_key: os.environ/MOCK_UPSTREAM_KEY
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_base: os.environ/MOCK_UPSTREAM_OPENAI
      api_key: os.environ/MOCK_UPSTREAM_KEY
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.0000004
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_requests_on_db_unavailable: true
