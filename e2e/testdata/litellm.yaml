# The gateway journey's LiteLLM. The one model routes to the mock upstream the
# test serves, at the pinned catalog's list prices for claude-haiku-5-5: 0.10
# USD per million input tokens and 0.50 per million output tokens. A store
# failure lets requests through, which is the case the journey records as none.
model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: os.environ/MOCK_UPSTREAM
      api_key: os.environ/MOCK_UPSTREAM_KEY
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_requests_on_db_unavailable: true
