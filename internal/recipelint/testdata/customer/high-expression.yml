# A script in the agent's job holds an expression, which the runner pastes
# into the shell before it runs.
name: review

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global @openai/codex@0.164.0-alpha.11.1
      - run: codex exec "Review pull request ${{ github.event.pull_request.number }}." >review.md
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
