# A comment starts the agent, and the job's if tests only the comment's text.
name: claude

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: claude -p "Answer the latest comment on this pull request." >answer.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
