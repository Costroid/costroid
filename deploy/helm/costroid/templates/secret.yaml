{{- include "costroid.check" . -}}
{{- if .Values.postgres.enabled }}
{{- $name := include "costroid.name" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $superuser := (get $data "postgres-password" | default (randAlphaNum 48 | b64enc)) }}
{{- $owner := (get $data "owner-password" | default (randAlphaNum 48 | b64enc)) }}
{{- $app := (get $data "app-password" | default (randAlphaNum 48 | b64enc)) }}
{{- $pseudonym := (get $data "pseudonym-key" | default (randAlphaNum 48 | b64enc | b64enc)) }}
{{- $host := include "costroid.postgresName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "costroid.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $superuser }}
  owner-password: {{ $owner }}
  app-password: {{ $app }}
  pseudonym-key: {{ $pseudonym }}
  database-url: {{ printf "postgres://costroid_app:%s@%s/costroid" ($app | b64dec) $host | b64enc }}
  migration-database-url: {{ printf "postgres://costroid_owner:%s@%s/costroid" ($owner | b64dec) $host | b64enc }}
{{- end }}
