# Builds, signs and publishes one release from a tag. Binaries and images are
# signed with cosign, keyless, under this workflow's identity. Every release
# carries an SPDX SBOM, and its files and image carry SLSA build provenance as
# GitHub artifact attestations.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.4
  IMAGE: ghcr.io/costroid/costroid

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Refuse a tag that must never ship
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The old npm package's postinstall fetches from v0.7.0's path, so an
          # old install would run whatever that tag held.
          if [[ $TAG == v0.7.0 ]]; then
            echo "::error::v0.7.0 is never a release of this repository"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

  binaries:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # costroid-install.sh is the install script with this release's version
      # and commit written in, so it checks the signature at this tag and
      # commit. Its name falls under costroid-*, so it is summed, signed and
      # attested with the binaries.
      - name: Write the install script
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$VERSION is not a version the install script can name"
            exit 1
          fi
          mkdir -p dist
          sed -e "s/^version=\$/version=$VERSION/" -e "s/^commit=\$/commit=$GITHUB_SHA/" scripts/install.sh >dist/costroid-install.sh
          grep -qx "version=$VERSION" dist/costroid-install.sh
          grep -qx "commit=$GITHUB_SHA" dist/costroid-install.sh
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA" \
              -o "dist/costroid-${target%/*}-${target#*/}" ./cmd/costroid
          done
      - name: Write the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/costroid.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Add the notice and the licence
        run: cp NOTICE LICENSE dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist
          if-no-files-found: error
          retention-days: 7

  image:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: false
      - name: Write the image's SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: costroid-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: costroid-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  # Signing has a job of its own, so the jobs that build hold no OIDC token.
  sign:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: sbom
      - name: Sum the files
        working-directory: dist
        run: sha256sum costroid-* costroid.spdx.json NOTICE LICENSE >SHA256SUMS
      # These steps run before cosign writes its bundles, so dist/costroid-*
      # matches the binaries and the install script, and no bundle.
      - name: Attest the files' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/costroid-*
            dist/costroid.spdx.json
            dist/NOTICE
            dist/LICENSE
            dist/SHA256SUMS
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the files, sign the image and attach its SBOM
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          # An upload to Rekor that times out can still write its entry, and
          # cosign's own retry of that upload then fails with 409. Each call
          # below signs again with a new key and certificate, so a retry writes
          # an entry of its own and never meets the earlier one.
          retry() {
            local attempt
            for attempt in 1 2; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt $attempt of 3 failed: $*"
              sleep $((attempt * 30))
            done
            "$@"
          }
          cd dist
          for file in costroid-* costroid.spdx.json NOTICE LICENSE SHA256SUMS; do
            retry cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          retry cosign sign --yes "$IMAGE@$DIGEST"
          retry cosign attest --yes --type spdxjson --predicate ../sbom/costroid-image.spdx.json "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, binaries, image, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flags=()
          if [[ $TAG == *-* ]]; then
            flags+=(--prerelease)
          fi
          cat >notes.md <<NOTES
          Install: download \`costroid-install.sh\`, read it, then run it. It checks this release's signature and checksum before it installs anything, and needs cosign 3 or later.

          \`\`\`sh
          curl -fsSLO https://github.com/$GH_REPO/releases/download/$TAG/costroid-install.sh
          less costroid-install.sh
          sh costroid-install.sh
          \`\`\`

          Image: \`ghcr.io/costroid/costroid@$DIGEST\`
          NOTES
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" "${flags[@]}" --notes-file notes.md
