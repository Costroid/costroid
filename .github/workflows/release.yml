# Builds, signs and publishes one release from a tag. Binaries and images are
# signed with cosign, keyless, under this workflow's identity. Every release
# carries an SPDX SBOM.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.27.3
  IMAGE: ghcr.io/costroid/costroid

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: Refuse a tag that must never ship
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The old npm package's postinstall fetches from v0.7.0's path, so an
          # old install would run whatever that tag held.
          if [[ $TAG == v0.7.0 ]]; then
            echo "::error::v0.7.0 is never a release of this repository"
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

  binaries:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/costroid-${target%/*}-${target#*/}" ./cmd/costroid
          done
      - name: Write the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/costroid.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sum and sign
        working-directory: dist
        run: |
          sha256sum costroid-* costroid.spdx.json >SHA256SUMS
          for file in costroid-* costroid.spdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 7

  image:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: false
      - name: Write the image's SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: costroid-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attach its SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate costroid-image.spdx.json "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: costroid-image.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [guard, binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flags=()
          if [[ $TAG == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" "${flags[@]}" \
            --notes "Image: \`ghcr.io/costroid/costroid@$DIGEST\`"
