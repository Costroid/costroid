name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  GO_VERSION: 1.27.4
  STATICCHECK_VERSION: 2026.2.2
  HELM_VERSION: v4.3.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog test compares CHANGELOG.md with every release tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
      - name: Run the checks
        run: make test
      - name: Lint the recipes
        run: go run ./cmd/costroid lint-recipes recipes action/action.yml
      - name: Validate an example configuration
        run: |
          printf 'comment:\n  show_cost: false\n' > costroid.yml
          go run ./cmd/costroid validate costroid.yml

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run the tests under the race detector
        # The race detector slows internal/run's property test past Go's
        # 10-minute default; it reads every recording line by line.
        run: go test -short -race -count=1 -timeout 25m ./...

  # The per-PR view's timing gate has a job of its own, so a slow runner reads
  # as a bench failure and never as a failed check.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Time the per-PR view on one million rows
        run: make bench-view

  # The accuracy page's checks have a job of their own, so a page that would
  # pass a stale writer or a class outside 1% reads as an accuracy failure.
  # They run on synthetic days; the kept days are checked where they are kept.
  accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Recompute and judge the accuracy page over synthetic days
        run: go test -count=1 ./scripts/accuracy/...

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install the libraries Ubuntu's shellcheck links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libffi8 libgmp10 libnuma1
      - name: Report vulnerabilities, shell findings and workflow findings
        run: make lint

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Walk the recorded run through every step
        run: make e2e

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint both shapes of the chart
        run: |
          helm lint --strict deploy/helm/costroid
          helm lint --strict deploy/helm/costroid --values deploy/helm/costroid/ci/external-postgres-values.yaml

  # Verifies the catalog release a run prices with against Sigstore's trust
  # root, under the catalog's release workflow at the release's tag, then holds
  # each of its sheets to the manifest that signature covers.
  catalog-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the catalog release's signed manifest and its sheets
        run: |
          cosign verify-blob --bundle catalog/0.3.0/SHA256SUMS.sigstore.json --certificate-identity https://github.com/Costroid/costroid-catalog/.github/workflows/release.yml@refs/tags/v0.3.0 --certificate-oidc-issuer https://token.actions.githubusercontent.com catalog/0.3.0/SHA256SUMS
          cd catalog/0.3.0
          sha256sum --check --strict SHA256SUMS

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          unsigned=$(git log --no-merges --format='%h %(trailers:key=Signed-off-by,valueonly,separator=%x20)' "$BASE..$HEAD" | awk 'NF < 2 { print $1 }')
          if [ -n "$unsigned" ]; then
            echo "Commits without Signed-off-by: $unsigned"
            exit 1
          fi
