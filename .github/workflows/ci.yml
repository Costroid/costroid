name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  GO_VERSION: 1.27.4
  STATICCHECK_VERSION: 2026.2.2
  HELM_VERSION: v4.3.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog test compares CHANGELOG.md with every release tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install staticcheck
        run: go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
      - name: Run the checks
        run: make test
      - name: Lint the recipes
        run: go run ./cmd/costroid lint-recipes recipes action/action.yml
      - name: Validate an example configuration
        run: |
          printf 'comment:\n  show_cost: false\n' > costroid.yml
          go run ./cmd/costroid validate costroid.yml

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run the tests under the race detector
        # The race detector slows internal/run's property test past Go's
        # 10-minute default; it reads every recording line by line.
        run: go test -short -race -count=1 -timeout 25m ./...

  # The per-PR view's timing gate has a job of its own, so a slow runner reads
  # as a bench failure and never as a failed check.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Time the per-PR view on one million rows
        run: make bench-view

  # The start bars are stated for two cores. The timing runs pinned to two of
  # the runner's cores, and the job fails when the pin does not give it two.
  bench-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Require two cores for the timing
        run: |
          pinned=$(taskset -c 0,1 nproc)
          echo "The runner has $(nproc --all) cores. The timing runs on $pinned of them."
          test "$pinned" -eq 2
      - name: Time costroid --version and costroid policy
        run: taskset -c 0,1 make bench-start

  # TestDemoRecipesMatchRelease reads a checkout of Costroid/costroid-demo
  # beside this repository and skips without one, so this job checks the demo
  # out there. The demo is public and read at its default branch, pinned by
  # nothing else: a change on that branch that leaves the release it pins
  # fails here. The grep fails the job if the test skipped.
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: costroid
          persist-credentials: false
          # The test reads the recipes at the tag the demo pins.
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Costroid/costroid-demo
          path: costroid-demo
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: costroid/go.sum
      - name: Hold the demo's workflows to the release they pin
        working-directory: costroid
        run: |
          go test -count=1 -run '^TestDemoRecipesMatchRelease$' -v ./cmd/costroid | tee demo.log
          grep -q '^--- PASS: TestDemoRecipesMatchRelease ' demo.log

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The three come from the runner's Ubuntu mirror alone. When that
      # mirror does not answer, this step fails and the job ends before
      # make lint, so none of the four linters reports.
      - name: Install the libraries Ubuntu's shellcheck links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libffi8 libgmp10 libnuma1
      - name: Report vulnerabilities, shell findings and workflow findings
        run: make lint

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Walk the recorded run through every step
        run: make e2e

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint both shapes of the chart
        run: |
          helm lint --strict deploy/helm/costroid
          helm lint --strict deploy/helm/costroid --values deploy/helm/costroid/ci/external-postgres-values.yaml

  # Verifies the catalog release a run prices with against Sigstore's trust
  # root, under the catalog's release workflow at the release's tag, then holds
  # each of its sheets to the manifest that signature covers.
  catalog-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the catalog release's signed manifest and its sheets
        run: |
          cosign verify-blob --bundle catalog/0.4.2/SHA256SUMS.sigstore.json --certificate-identity https://github.com/Costroid/costroid-catalog/.github/workflows/release.yml@refs/tags/v0.4.2 --certificate-oidc-issuer https://token.actions.githubusercontent.com catalog/0.4.2/SHA256SUMS
          cd catalog/0.4.2
          sha256sum --check --strict SHA256SUMS

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a sign-off on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          unsigned=$(git log --no-merges --format='%h %(trailers:key=Signed-off-by,valueonly,separator=%x20)' "$BASE..$HEAD" | awk 'NF < 2 { print $1 }')
          if [ -n "$unsigned" ]; then
            echo "Commits without Signed-off-by: $unsigned"
            exit 1
          fi
