name: fuzz

# Every fuzz target for 3 minutes, each night and on demand. Pull requests run
# the seeds through go test, so they are not fuzzed here.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  GO_VERSION: 1.27.3
  FUZZTIME: 3m

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: List every fuzz target
        id: list
        run: |
          for package in $(go list ./...); do
            listed=$(go test -short -list '^Fuzz' "$package")
            for target in $(printf '%s\n' "$listed" | grep '^Fuzz' || true); do
              jq -nc --arg package "$package" --arg target "$target" '{package: $package, target: $target}'
            done
          done > targets.jsonl
          echo "targets=$(jq -sc . targets.jsonl)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The corpus lives under the build cache, so setup-go's own cache of it
      # stays off and the corpus has a cache of its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Find the corpus
        id: corpus
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: echo "dir=$(go env GOCACHE)/fuzz/$PACKAGE/$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.package }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.package }}-${{ matrix.target }}-
      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test -short -run '^$' -fuzz "^$TARGET\$" -fuzztime "$FUZZTIME" "$PACKAGE"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failing-input-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/"
          if-no-files-found: ignore
